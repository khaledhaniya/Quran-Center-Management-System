name: Deploy API to MonsterASP.NET

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: "monsterasp"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish API
        run: |
          dotnet publish QuranCircles.Api/QuranCircles.Api/QuranCircles.Api.csproj -c Release -o ./publish

      - name: Deploy to MonsterASP.NET via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: 'site90430'
          server-computer-name: 'site90430.siteasp.net'
          server-username: 'site90430'
          server-password: 'z-3X6Z#rBh9='
          source-path: './publish'
