name: Deploy API to MonsterASP.NET

on:
  workflow_dispatch:

concurrency:
  group: "monsterasp"
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  build-and-deploy:
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish and Deploy API to MonsterASP
        env:
          MONSTERASP_PASSWORD: ${{ secrets.MONSTERASP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MONSTERASP_PASSWORD)) { throw "Configure the MONSTERASP_PASSWORD repository secret before deployment." }
          dotnet publish QuranCircles.Api/QuranCircles.Api/QuranCircles.Api.csproj -c Release /p:PublishProfile=MonsterASP /p:Password="$env:MONSTERASP_PASSWORD" /p:AuthType=Basic
