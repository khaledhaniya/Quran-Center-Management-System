name: Deploy API to MonsterASP.NET

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: "monsterasp"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish and Deploy API to MonsterASP
        run: |
          dotnet publish QuranCircles.Api/QuranCircles.Api/QuranCircles.Api.csproj -c Release /p:PublishProfile=MonsterASP /p:Password="z-3X6Z#rBh9=" /p:AllowUntrustedCertificate=True /p:AuthType=Basic
