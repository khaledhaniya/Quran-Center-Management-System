name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  build-apk:
    needs: validate
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart
        run: |
          flutter --version
          dart --version

      - name: Install Dependencies
        working-directory: QuranCircles.Mobile
        run: flutter pub get

      - name: Build Android APK (Release)
        working-directory: QuranCircles.Mobile
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuranCenter-Release-APK
          path: QuranCircles.Mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest-apk
          name: "أحدث إصدار لتطبيق مركز القرآن (Android APK)"
          draft: false
          prerelease: false
          body: |
            ### 📱 تطبيق مركز البيان لتعليم القرآن الكريم (Android APK)

            **أهم التحديثات في هذا الإصدار:**
            - كشف حضور المعلمين لجميع أيام الفترة مع حالة الغياب والبديل وتمرير مناسب لشاشة الجوال.
            - تخطيط التسميع والدورات وتحديث الإنجاز من إدارة المركز أو مشرف الجودة.
            - شهادات المركز كاملة لمشرف الجودة وتعاميمه لمعلمي الحلقات والمدير.
            - صدارة الحلقات متاحة للمعلم حتى دون تكليف، وتحسين تسجيل الطلاب وتبديل الحسابات.
          files: QuranCircles.Mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
